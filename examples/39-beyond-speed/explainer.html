// a chart controller: values in data units, axis max, row ranks; tweened together so bars and axis agree
function chart(s, init) {
  const n = LANGS.length;
  const st = Object.assign({lo: Array(n).fill(0), hi: Array(n).fill(0), hs: Array(n).fill(0), rank: LANGS.map((_, i) => i), max: 1, tick: v => v, sq: 0}, init);
  st.y = st.rank.map(rowY);
  const el = LANGS.map((_, i) => ({g: s.q('#r' + i), b: s.q('#b' + i), h: s.q('#h' + i)}));
  const ticksG = s.q('#ticks'), sq = s.q('#sq');
  function niceStep(max) { for (const m of [.01, .02, .05, .1, .2, .5, 1, 2, 5, 10, 20, 50, 100, 200, 500]) if (max / m <= 5.2) return m; return 1000; }
  function paint() {
    const X = v => X0 + v / st.max * XW;
    el.forEach((e, i) => {
      const a = X(st.lo[i]), b = X(st.hi[i]);
      e.b.setAttribute('x', a.toFixed(1)); e.b.setAttribute('width', Math.max(0, b - a).toFixed(1));
      e.h.setAttribute('width', Math.max(0, X(Math.min(st.hs[i], st.hi[i])) - X0).toFixed(1));
      e.g.setAttribute('transform', `translate(0 ${st.y[i].toFixed(1)})`);
    });
    const step = niceStep(st.max); let t = '';
    for (let v = 0; v <= st.max * 1.0001; v += step) {
      const x = X(v); if (x > X0 + XW + 4) break;
      t += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="334" y2="339" stroke="${C.mut}"/>` +
        `<text x="${x.toFixed(1)}" y="353" font-size="13" text-anchor="middle" fill="${C.mut}">${st.tick(+v.toFixed(4), step)}</text>`;
    }
    ticksG.innerHTML = t;
    if (sq) { const side = 60 * Math.sqrt(st.sq); sq.setAttribute('y', (70 - side).toFixed(1)); sq.setAttribute('width', side.toFixed(1)); sq.setAttribute('height', side.toFixed(1)); }
  }
  function to(tg, dur = 650) {
    const from = {lo: st.lo.slice(), hi: st.hi.slice(), hs: st.hs.slice(), y: st.y.slice(), max: st.max, sq: st.sq};
    const end = {lo: tg.lo || from.lo, hi: tg.hi || from.hi, hs: tg.hs || from.hs, y: tg.rank ? tg.rank.map(rowY) : from.y, max: tg.max || from.max, sq: tg.sq ?? from.sq};
    if (tg.tick) st.tick = tg.tick;
    if (tg.rank) st.rank = tg.rank;
    return s.tween(dur, k => {
      for (const key of ['lo', 'hi', 'hs', 'y']) st[key] = from[key].map((v, i) => K.lerp(v, end[key][i], k));
      st.max = Math.exp(K.lerp(Math.log(from.max), Math.log(end.max), k));
      st.sq = K.lerp(from.sq, end.sq, k);
      paint();
    });
  }
  paint();
  return {st, paint, to};
}
