      cap: 'Where do today’s AI agents sit on this map? Nobody has measured their coordination. The evidence so far says teams of agents still coordinate poorly, which fits jobs and firms looking much as before.',
      draw: () => {
        let s = map({quick: true, dimLabels: true});
        s += `<line x1="47" y1="${MYB - 4}" x2="47" y2="${MYT + 4}" stroke="${C.violet}" stroke-width="2" stroke-dasharray="4 4" data-k="fade" data-t="500" data-d="400"/>` +
          T(24, 150, '?', {h: 1, z: 30, c: 'violet', t: 700}) +
          T(60, 160, "today's agents: not measured", {z: 14, a: 'start', c: 'violet', t: 800});
        s += T(14, 286, "Evidence on today's systems", {h: 1, z: 19, a: 'start', t: 1000});
        const bar = (y, lo, hi, t, label) => {
          const sx = K.scale(0, 100, 24, 356);
          return `<rect x="24" y="${y}" width="332" height="12" rx="3" fill="${C.faint}" data-k="fade" data-t="${t}" data-d="400"/>` +
            `<rect x="${sx(lo)}" y="${y}" width="${sx(hi) - sx(lo)}" height="12" rx="3" fill="${C.fill.violet}" data-k="fade" data-t="${t + 300}" data-d="500"/>` +
            T(24, y + 30, '0%', {z: 14, c: 'mut', a: 'start', t}) + T(356, y + 30, '100%', {z: 14, c: 'mut', a: 'end', t}) + label;
        };
        const sx = K.scale(0, 100, 24, 356);
        s += T(14, 314, `Teams of AI agents failed ${DATA.cemri[0]}–${DATA.cemri[1]}% of tasks`, {z: 15, a: 'start', t: 1100}) +
          bar(319, DATA.cemri[0], DATA.cemri[1], 1200, T((sx(DATA.cemri[0]) + sx(DATA.cemri[1])) / 2, 349, `${DATA.cemri[0]}–${DATA.cemri[1]}%`, {z: 14, c: 'violet', t: 1600})) +
          T(14, 366, 'from coordination problems (Cemri et al., 2025)', {z: 14, a: 'start', c: 'mut', t: 1300});
        s += T(14, 392, 'Recent AI gains credited to agent teamwork', {z: 15, a: 'start', t: 1900}) +
          bar(400, 0, DATA.brownUnder, 2000, T(sx(DATA.brownUnder) + 8, 430, `under ${DATA.brownUnder}%`, {z: 14, c: 'violet', a: 'start', t: 2400})) +
          T(14, 450, "Noam Brown (OpenAI), as reported in the essay", {z: 14, a: 'start', c: 'mut', t: 2100});
        return s + TAG("Map: toy economy. Bars: studies of real AI systems", 2200);
      },
      duration: 3000 },

    { title: '6. What to watch', keys: [],
      cap: 'Watch pay and roles first, then firm size. Test AI on working as a team, not only on solo tasks. And keep the limits in mind: a 14-person toy economy and modelled scenarios, not forecasts.',
      draw: () => {
        let s = '';
        const item = (y, n, head, lines, t, seed) => {
          let r = P(ellipse(30, y - 6, 13, 13, seed), 'amber', t, 400, 1.6) + T(30, y, String(n), {h: 1, z: 19, c: 'amber', t}) +
            T(52, y, head, {h: 1, z: 19, a: 'start', t: t + 100});
          lines.forEach((l, i) => r += T(52, y + 22 + i * 19, l, {z: 14, a: 'start', c: i === 0 && lines.length === 1 ? 'mut' : 'ink', t: t + 200 + i * 80}));
          return r;
        };
        s += item(40, 1, 'Pay and job roles move first', ['Firm size and concentration come later.'], 200, 81);
        s += item(108, 2, 'Benchmarks for teams of agents', ['• split an unfamiliar problem', '• avoid duplicate work', '• keep context across handoffs', '• catch errors instead of compounding them'], 700, 82);
        s += item(244, 3, 'Count compute next to payroll', ['AI copies cost compute, not wages.'], 1400, 83);
        s += P(rect(14, 300, 352, 150, 84), 'mut', 1900, 600, 1.2) + T(28, 326, 'Limits of this lesson', {h: 1, z: 19, a: 'start', t: 2100});
        ['• a 14-person toy economy', '• a hand-picked output formula', '• scenarios, not forecasts', "• nobody has measured where today's", "   agents sit on the coordination dial"].forEach((l, i) =>
          s += T(l.startsWith(' ') ? 40 : 28, 350 + i * 20, l.trim(), {z: 14, a: 'start', t: 2200 + i * 120}));
        return s + T(190, 472, 'Source: Imas, Koh & Legg (2026), arXiv 2611.05417', {z: 14, c: 'mut', t: 2800});
      },
      start(s) {   // links to the sources, styled like the kit's buttons
        [['Read the paper', 'https://arxiv.org/abs/2611.05417'], ['Read the essay', 'https://institute.deepmind.com/essays/the-economics-of-intelligence/']].forEach(([label, href]) => {
          const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label + ' ↗';
          a.style.cssText = 'display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border:1px solid var(--k-line);border-radius:8px;color:var(--k-ink);text-decoration:none;font-size:13px';
          s.act.appendChild(a); });
      },
      duration: 3200 },
  ],
});
