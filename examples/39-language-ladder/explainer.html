const TICKS = [1, 2, 5, 10, 20, 40];
const fx = v => (v < 10 ? (v + 1e-9).toFixed(1) : (v + 1e-9).toFixed(0)) + '×';   // 2.55 -> 2.6, not 2.5
const snap = v => v < 2 ? Math.round(v * 10) / 10 : v < 10 ? Math.round(v * 2) / 2 : Math.round(v);

function axis(t0 = 0, label = 'times as long as the fastest version (log scale)') {
  let m = '';
  TICKS.forEach((v, k) => {
    m += P(line(X(v), 58, X(v), 326, 40 + k, 0.4), 'faint', t0 + k * 40, 300, 1);
    m += T(X(v), 344, v + '×', {z: 13, c: 'mut', t: t0 + 100 + k * 40});
  });
  m += T((AX0 + AX1) / 2 + 10, 366, label, {z: 13, c: 'mut', t: t0 + 300});
  return m;
}
function rowLabels(t0 = 0, dimFrom = 99) {
  return DATA.rel.map((r, i) => T(12, Y(i) + 5, r.v, {z: 14, a: 'start', c: i >= dimFrom ? 'mut' : 'ink', t: t0 + i * 70})).join('');
}

/* the reader's guesses live outside the steps so they survive moving between steps */
const GUESS = DATA.rel.map(() => null);
let REVEALED = false;
const DEMO_GUESS = [1, 1, 1.5, 2, 2, 3, 3, 10];   // the example guess used by autoplay and recordings

function drawGuessLayer(s, locked) {
  const g = s.el('g', {id: 'guesses'});
  DATA.rel.forEach((r, i) => {
    const v = GUESS[i] == null ? 1 : GUESS[i], on = GUESS[i] != null;
    const y = Y(i);
    const ln = s.el('line', {x1: AX0, y1: y, x2: X(v), y2: y, stroke: C.amber, 'stroke-width': 3, 'stroke-linecap': 'round',
      'stroke-dasharray': locked ? '4 4' : 'none', opacity: on ? (locked ? .75 : .9) : .35}, g);
    const dot = s.el('circle', {cx: X(v), cy: y, r: locked ? 5 : 8, fill: locked ? 'none' : C.amber, stroke: C.amber,
      'stroke-width': 2, opacity: on ? 1 : .45}, g);
    let txt = null;
    if (!locked) { txt = s.el('text', {x: 368, y: y + 5, 'text-anchor': 'end', 'font-size': 14, fill: C.amber, opacity: on ? 1 : 0,
      style: 'font-family:var(--font-sans,system-ui,sans-serif);font-variant-numeric:tabular-nums'}, g); txt.textContent = fx(v); }
    r._g = {ln, dot, txt};
  });
}
function setGuess(i, v) {
  v = snap(K.clamp(v, 1, VMAX)); GUESS[i] = v;
  const o = DATA.rel[i]._g; if (!o) return;
  o.ln.setAttribute('x2', X(v).toFixed(1)); o.ln.setAttribute('opacity', .9);
  o.dot.setAttribute('cx', X(v).toFixed(1)); o.dot.setAttribute('opacity', 1);
  if (o.txt) { o.txt.textContent = fx(v); o.txt.setAttribute('opacity', 1); }
}

/* the gap between guess and measurement, in the data's own units (a factor) */
function gapSummary() {
  const done = DATA.rel.map((r, i) => ({r, g: GUESS[i]})).filter(d => d.g != null);
  if (!done.length) return null;
  done.forEach(d => { d.f = Math.max(d.g / d.r.mid, d.r.mid / d.g); });
  const worst = done.reduce((a, b) => b.f > a.f ? b : a);
  const avg = Math.exp(done.reduce((a, d) => a + Math.log(d.f), 0) / done.length);
  return {done, worst, avg};
}

/* step 6's caption is computed from the data so text and drawing agree */
const NPR = DATA.tasks.map(d => d.plain / d.numpy);
const fr = r => (r < 10 ? r.toFixed(1) : r.toFixed(0)) + '×';
const STEP6_CAP = `NumPy runs one fast operation over a whole array. On heat and springs that made it ${fr(Math.min(NPR[0], NPR[1]))} to ${fr(Math.max(NPR[0], NPR[1]))} faster than plain Python. ` +
  `On ledger and log scan, read record by record, NumPy was ${Math.round((1 / NPR[3] - 1) * 100)} to ${Math.round((1 / NPR[2] - 1) * 100)}% slower.`;

let API;
API = K.stepper({
  root: '#x', style: 'chalkboard', viewBox: [380, 380],
  title: 'How much slower is each programming language than the fastest one, in programs written by ten AI models: a guess-then-reveal lesson.',
  legend: [
    {key: 'you', label: 'Your guess', color: 'amber'},
    {key: 'meas', label: 'Measured: middle of 10 models, and their range', color: 'blue'},
    {key: 'model', label: 'One model', color: 'ink'},
    {key: 'fast', label: 'Rust, C++ or Go', color: 'fill.green'},
    {key: 'numpy', label: 'NumPy Python', color: 'fill.violet'},
    {key: 'plain', label: 'Plain Python', color: 'fill.red'},
  ],
  extraCaptions: [
    'Biggest gap: NumPy Python. You guessed 1.0×, measured 8.9× (6.8× to 13.3× across the ten models). On average your 8 guesses were off by a factor of 10.0.',
    'You skipped the guess. Dot: the middle of the ten models. Bar: from the fastest model to the slowest. Rust and C++ sit near 1×, plain Python near 32×.',
  ],
  steps: [
    { title: '1. The measuring stick', keys: [],
      cap: 'Each model wrote every program in eight versions. A version scores its time divided by the fastest of the eight: 1× is the fastest, 10× takes ten times as long. The axis stretches so 1× to 40× fit.',
      draw: () => rowLabels(200) + axis(800) +
        T(AX0 - 4, 42, '1× = fastest', {h: 1, z: 17, a: 'start', c: 'green', t: 1500}) +
        P(line(AX0 + 6, 47, X(1) + 1, 60, 61), 'green', 1700, 300, 1.3) +
        T(368, 42, '10× = 10 times as long', {h: 1, z: 17, a: 'end', c: 'blue', t: 2100}) +
        P(line(X(10) + 12, 47, X(10) + 2, 60, 62), 'blue', 2300, 300, 1.3),
      duration: 2800 },

    { title: '2. Your guess', keys: ['you'], ask: true,
      cap: 'Drag the amber marker on each row to where you think that version lands. Rust starts at 1× on purpose: some version has to be the fastest. Then press Reveal.',
      draw: () => rowLabels(0) + axis(0) + T(368, 42, 'your guess', {h: 1, z: 16, a: 'end', c: 'amber', t: 200}),
      start(s) {
        if (REVEALED) { GUESS.fill(null); REVEALED = false; }
        drawGuessLayer(s, false);
        const reveal = s.btn('check', 'Reveal', () => { REVEALED = true; API.go(2); }, {primary: true});
        const skip = s.btn('', 'Skip', () => { GUESS.fill(null); REVEALED = true; API.go(2); });
        const sync = () => { reveal.disabled = !GUESS.some(g => g != null); };
        sync();
        DATA.rel.forEach((r, i) => {
          const hit = s.el('rect', {x: AX0 - 16, y: Y(i) - 17, width: AX1 - AX0 + 40, height: 34, fill: 'transparent',
            role: 'slider', tabindex: 0, 'aria-label': 'Your guess for ' + r.v + ', times as long as the fastest'});
          s.drag(hit, {move: p => { setGuess(i, XI(p.x)); sync(); }});
          hit.addEventListener('keydown', ev => {
            const v = GUESS[i] == null ? 1 : GUESS[i];
            if (ev.key === 'ArrowRight' || ev.key === 'ArrowUp') { ev.preventDefault(); s.touched(); setGuess(i, v * 1.15 + .05); sync(); }
            if (ev.key === 'ArrowLeft' || ev.key === 'ArrowDown') { ev.preventDefault(); s.touched(); setGuess(i, v / 1.15); sync(); }
          });
        });
        s.at(1200, () => { if (!GUESS.some(g => g != null)) { s.ring(AX0 - 14, Y(7) - 15, 60, 30, 'amber'); s.float(AX0 + 40, Y(7) - 12, 'drag →', 'amber', 16); } });
      },
      demo: async s => {
        for (let i = 0; i < 8; i++) {
          const to = DEMO_GUESS[i];
          await s.tween(260, k => setGuess(i, 1 + (to - 1) * k), {ease: 'out'});
          await s.wait(90);
        }
        s.root.querySelector('.kx-act button.pri').disabled = false;
      },
      demoDuration: 3400, duration: 900 },

    { title: '3. The measured ladder', keys: ['you', 'meas'],
      cap: 'Dot: the middle of the ten models. Bar: from the fastest model to the slowest. Rust, C++ and Go sit near 1×; plain Python takes about 32 times as long.',
      draw: () => rowLabels(0) + axis(0),
      start(s) {
        const gs = gapSummary();
        if (gs) drawGuessLayer(s, true);
        DATA.rel.forEach((r, i) => {
          const y = Y(i), t = 400 + i * 230;
          const bar = s.el('rect', {x: X(r.min), y: y - 5, width: Math.max(2, X(r.max) - X(r.min)), height: 10, rx: 4,
            fill: C.fill.blue, 'fill-opacity': .45});
          const dot = s.el('circle', {cx: X(r.mid), cy: y, r: 5.5, fill: C.blue});
          [bar, dot].forEach(e => s.fadeIn(e, 450, t));
          const tx = s.write(368, y + 5, fx(r.mid), {z: 14, a: 'end', c: 'blue', t});
        });
        const tEnd = 400 + 8 * 230 + 600;
        if (gs) {
          s.at(tEnd, () => {
            const w = gs.worst, i = ROW[w.r.v], y = Y(i) - 13;
            const xa = X(Math.min(w.g, w.r.mid)), xb = X(Math.max(w.g, w.r.mid));
            if (xb - xa > 8) {
              const br = s.el('path', {d: `M${xa} ${y + 5} L${xa} ${y} L${xb} ${y} L${xb} ${y + 5}`, fill: 'none', stroke: C.amber, 'stroke-width': 1.6});
              s.drawIn(br, 500);
            }
            s.ring(AX0 - 108, Y(i) - 15, 360, 30, 'amber');
            s.cap(`Biggest gap: ${w.r.v}. You guessed ${fx(w.g)}, measured ${fx(w.r.mid)} (${fx(w.r.min)} to ${fx(w.r.max)} across the ten models). ` +
              `On average your ${gs.done.length} guess${gs.done.length > 1 ? 'es were' : ' was'} off by a factor of ${gs.avg.toFixed(1)}.`);
          });
        } else if (REVEALED) {
          s.cap('You skipped the guess. Dot: the middle of the ten models. Bar: from the fastest model to the slowest. Rust and C++ sit near 1×, plain Python near 32×.');
        }
      },
      duration: 3400 },

    { title: '4. Every model, same order', keys: ['model'],
      cap: 'Tap Next model to trace one model’s eight versions. Rust, C++ and Go swap places, but below them all ten models kept one order: C#, Java, JavaScript, NumPy Python, plain Python.',
      draw: () => rowLabels(0) + axis(0) +
        T(368, 42, `${SAME_ORDER} of ${MODELS.length} models: same order`, {z: 13, a: 'end', c: 'mut', t: 300}),
      start(s) {
        // faint dots: every model's eight versions
        DATA.rel.forEach((r, i) => r.by.forEach(v => s.el('circle', {cx: X(v), cy: Y(i), r: 3.2, fill: C.mut, opacity: .55})));
        const path = s.el('path', {d: '', fill: 'none', stroke: C.ink, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round'});
        const dots = DATA.rel.map(() => s.el('circle', {cx: AX0, cy: 0, r: 5, fill: C.ink, opacity: 0}));
        const vals = DATA.rel.map(() => { const t = s.el('text', {x: 368, y: 0, 'text-anchor': 'end', 'font-size': 14, fill: C.ink,
          style: 'font-family:var(--font-sans,system-ui,sans-serif);font-variant-numeric:tabular-nums'}); return t; });
        const name = s.el('text', {x: 12, y: 42, 'text-anchor': 'start', 'font-size': 19, fill: C.ink, style: 'font-family:var(--k-hand)'});
        let j = -1;
        const show = () => {
          j = (j + 1) % MODELS.length;
          name.textContent = MODELS[j];
          const pts = DATA.rel.map((r, i) => [X(r.by[j]), Y(i)]);
          path.setAttribute('d', 'M' + pts.map(p => p.map(n => n.toFixed(1)).join(' ')).join(' L'));
          s.drawIn(path, 700);
          pts.forEach((p, i) => { dots[i].setAttribute('cx', p[0]); dots[i].setAttribute('cy', p[1]); s.fadeIn(dots[i], 300, i * 70);
            vals[i].setAttribute('y', Y(i) + 5); vals[i].textContent = fx(DATA.rel[i].by[j]); s.fadeIn(vals[i], 300, i * 70); });
        };
        s.at(500, show);
        s.btn('right', 'Next model', show, {primary: true});
      },
      demo: async s => { for (let k = 0; k < 3; k++) { s.tap(s.root.querySelector('.kx-act button')); await s.wait(1500); } },
      idleDemo: 5000, demoDuration: 4800, duration: 1400 },

    { title: '5. The model matters too', keys: ['meas'],
      cap: `Who wrote the code moves each rung. Nemotron’s NumPy Python took about twice as long as Terra’s (${fx(NP.max)} against ${fx(NP.min)}). Yet the slowest NumPy still beat the fastest plain Python by ${(PL.min / NP.max).toFixed(1)}×.`,
      draw: () => {
        const rows = [CPP, NP, PL], ys = [112, 200, 288];
        let m = '';
        TICKS.forEach((v, k) => { m += P(line(X(v), 70, X(v), 318, 70 + k, 0.4), 'faint', k * 40, 300, 1);
          m += T(X(v), 344, v + '×', {z: 13, c: 'mut', t: 100 + k * 40}); });
        m += T((AX0 + AX1) / 2 + 10, 366, 'times as long as the fastest version (log scale)', {z: 13, c: 'mut', t: 300});
        rows.forEach((r, k) => {
          const y = ys[k], t = 400 + k * 700;
          m += T(12, y + 5, r.v, {z: 14, a: 'start', t});
          m += `<rect x="${X(r.min).toFixed(1)}" y="${y - 5}" width="${(X(r.max) - X(r.min)).toFixed(1)}" height="10" rx="4" fill="${C.fill.blue}" fill-opacity=".4" data-k="fade" data-t="${t}" data-d="400"/>`;
          r.by.forEach((v, j) => { m += `<circle cx="${X(v).toFixed(1)}" cy="${y}" r="3.6" fill="${C.blue}" data-k="fade" data-t="${t + 100 + j * 30}" data-d="300"/>`; });
          const left = X(r.min) < 200;
          m += T(left ? X(r.min) - 3 : X(r.min) + 3, y + 24, `${r.minM} ${fx(r.min)}`, {z: 13, a: left ? 'start' : 'end', c: 'blue', t: t + 450, extra: `stroke="${C.bg}" stroke-width="4" paint-order="stroke"`});
          m += T(left ? X(r.max) - 6 : X(r.max) + 6, y - 14, `${r.maxM} ${fx(r.max)}`, {z: 13, a: left ? 'start' : 'end', c: 'blue', t: t + 550, extra: `stroke="${C.bg}" stroke-width="4" paint-order="stroke"`});
        });
        m += T(368, 42, 'each dot is one model', {h: 1, z: 16, a: 'end', c: 'mut', t: 200});
        return m;
      },
      duration: 2900 },

    { title: '6. When NumPy helps', keys: ['fast', 'numpy', 'plain'],
      cap: STEP6_CAP,
      draw: () => {
        const S0 = 112, S1 = 268, LO = 0.05, HI = 20;
        const SX = v => S0 + Math.log(v / LO) / Math.log(HI / LO) * (S1 - S0);
        const ys = [86, 124, 208, 246];
        let m = '';
        [[0.1, '0.1 s'], [1, '1 s'], [10, '10 s']].forEach(([v, l], k) => {
          m += P(line(SX(v), 66, SX(v), 262, 90 + k, 0.4), 'faint', k * 40, 300, 1);
          m += T(SX(v), 280, l, {z: 13, c: 'mut', t: 100 + k * 40}); });
        m += T(S0 - 100, 54, 'Same sum over a whole array', {h: 1, z: 17, a: 'start', c: 'ink', t: 200});
        m += T(S0 - 100, 176, 'Reading text, record by record', {h: 1, z: 17, a: 'start', c: 'ink', t: 1600});
        m += T(368, 54, 'NumPy vs plain', {z: 13, a: 'end', c: 'mut', t: 200});
        DATA.tasks.forEach((d, k) => {
          const y = ys[k], t = (d.group ? 1700 : 300) + (k % 2) * 300;
          m += T(12, y, d.name, {z: 14, a: 'start', t}) + T(12, y + 15, d.sub, {z: 13, a: 'start', c: 'mut', t});
          m += P(line(SX(d.rust), y + 4, SX(Math.max(d.numpy, d.plain)), y + 4, 100 + k, 0.3), 'faint', t, 300, 1);
          m += `<circle cx="${SX(d.rust).toFixed(1)}" cy="${y + 4}" r="5.5" fill="${C.fill.green}" data-k="fade" data-t="${t + 150}" data-d="300"/>`;
          m += `<rect x="${(SX(d.numpy) - 5.5).toFixed(1)}" y="${y - 1.5}" width="11" height="11" fill="${C.fill.violet}" data-k="fade" data-t="${t + 300}" data-d="300"/>`;
          const px = SX(d.plain), py = y + 4;
          m += `<path d="M${px.toFixed(1)} ${py - 7} L${(px + 7).toFixed(1)} ${py} L${px.toFixed(1)} ${py + 7} L${(px - 7).toFixed(1)} ${py} Z" fill="${C.fill.red}" data-k="fade" data-t="${t + 450}" data-d="300"/>`;
          const r = d.plain / d.numpy;
          const txt = r >= 1 ? `${r < 10 ? r.toFixed(1) : r.toFixed(0)}× faster` : `${Math.round((1 / r - 1) * 100)}% slower`;
          m += T(368, y + 9, txt, {z: 14, a: 'end', c: r >= 1 ? 'violet' : 'red', w: 600, t: t + 700});
        });
        // key for the shapes (colour is never the only cue)
        m += `<circle cx="20" cy="312" r="5.5" fill="${C.fill.green}"/>` + T(30, 317, 'Rust', {z: 13, a: 'start'});
        m += `<rect x="78" y="306.5" width="11" height="11" fill="${C.fill.violet}"/>` + T(96, 317, 'NumPy Python', {z: 13, a: 'start'});
        m += `<path d="M205 305 L212 312 L205 319 L198 312 Z" fill="${C.fill.red}"/>` + T(218, 317, 'plain Python', {z: 13, a: 'start'});
        m += T(12, 346, 'seconds, middle of the ten models', {z: 13, a: 'start', c: 'mut'});
        m += T(12, 366, 'Python was the models’ fastest effort', {z: 13, a: 'start', c: 'mut'});
        return m;
      },
      duration: 3200 },

    { title: '7. If seconds matter', keys: ['fast', 'plain'],
      cap: 'Rust, C++ or Go was fastest in all 80 task-and-model pairs. Limits: eight tasks, one Windows laptop, every program correct. The models wrote fast Python; everyday Python is slower still.',
      draw: () => {
        let m = T(12, 40, 'Which version was fastest?', {h: 1, z: 20, a: 'start'}) +
          T(12, 60, `each square: one model on one task (${DATA.fastest.total} in all)`, {z: 13, a: 'start', c: 'mut', t: 100});
        const blocks = [['Rust', 14], ['C++', 136], ['Go', 258]];
        let t = 300;
        blocks.forEach(([v, x0]) => {
          const n = DATA.fastest[v];
          m += T(x0, 92, `${v}: ${n}`, {z: 15, a: 'start', w: 600, c: 'green', t});
          for (let j = 0; j < n; j++) { const g = K.grid(j, {cols: 8, x0: x0 + 4, y0: 106, gap: 13});
            m += `<rect x="${(g.x - 5).toFixed(1)}" y="${(g.y - 5).toFixed(1)}" width="10" height="10" rx="1.5" fill="${C.fill.green}" data-k="fade" data-t="${t + j * 14}" data-d="200"/>`; }
          t += n * 14 + 150;
        });
        m += T(12, 196, 'C#, Java, JavaScript, both Pythons: 0', {z: 14, a: 'start', c: 'mut', t: t + 100});
        m += T(12, 216, `Same in one-reply programs: ${DATA.fastest.oneReply} of ${DATA.fastest.oneReply}`, {z: 14, a: 'start', c: 'mut', t: t + 300});
        m += T(12, 262, 'Seconds matter?', {h: 1, z: 24, a: 'start', t: t + 800});
        m += T(12, 296, 'Ask for Rust, C++ or Go.', {h: 1, z: 26, a: 'start', c: 'green', w: 700, t: t + 1100});
        m += P(line(14, 304, 236, 304, 140, 1), 'green', t + 1400, 500, 1.6);
        m += T(12, 338, `Plain Python took ${fx(PL.min)} to ${fx(PL.max)} as long`, {z: 14, a: 'start', c: 'red', t: t + 1800});
        m += T(12, 358, `as the fastest version, depending on the model.`, {z: 14, a: 'start', c: 'red', t: t + 1800});
        return m;
      },
      duration: 4600 },
  ],
});

</script>
