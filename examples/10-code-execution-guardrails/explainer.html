/* ---------- request text: one token per path part, wrapped at slashes, with highlights */
function tokens(path) { const parts = path.split('/'), out = []; parts.forEach((x, i) => { if (i > 0) out.push({t: '/', part: -1}); if (x) out.push({t: x, part: i}); }); return out; }
function wrapLines(path, max = 34) {
  const tk = tokens(path), lines = [[]]; let n = 0;
  tk.forEach(k => { if (k.t !== '/' && n + k.t.length > max && lines[lines.length - 1].length) { lines.push([]); n = 0; } lines[lines.length - 1].push(k); n += k.t.length; });
  return lines.slice(0, 2);
}
// o.match = number of leading characters the prefix test matched (green); o.active = part index lit up (amber)
function pathMarkup(path, o = {}) {
  if (path.length > 70) path = path.slice(0, 69) + '…';
  const lines = wrapLines(path); let pos = 0;
  return lines.map((ln, li) => {
    const spans = ln.map(k => {
      const a = pos, b = pos + k.t.length; pos = b;
      const act = o.active != null && k.part === o.active, st = act ? ` fill="${C.amber}" font-weight="700" text-decoration="underline"` : '';
      if (o.match && a < o.match) {
        const cut = Math.min(k.t.length, o.match - a);
        return `<tspan fill="${C.green}" font-weight="700">${K.esc(k.t.slice(0, cut))}</tspan>` + (cut < k.t.length ? `<tspan${st}>${K.esc(k.t.slice(cut))}</tspan>` : '');
      }
      return `<tspan${st}>${K.esc(k.t)}</tspan>`;
    }).join('');
    return `<text x="18" y="${50 + li * 22}" font-size="15" fill="${C.ink}" style="font-family:Consolas,'SF Mono',Menlo,ui-monospace,monospace">${spans}</text>`;
  }).join('');
}
const OPW = {read: 'read', write: 'write', delete: 'delete', other: 'run'};
function setRequest(s, op, path, o = {}) {
  let g = s.q('#req'); if (!g) g = s.el('g', {id: 'req'});
  const opword = FILE_OPS.includes(op) ? op : 'run';
  g.innerHTML = `<text x="18" y="24" font-size="14" fill="${C.mut}">Agent asks to <tspan fill="${C.amber}" font-weight="700">${K.esc(opword)}</tspan></text>` + pathMarkup(path, o) +
    (o.tag ? `<text x="362" y="24" text-anchor="end" font-size="13" fill="${C[o.tagC || 'mut']}">${K.esc(o.tag)}</text>` : '');
  return g;
}

/* ---------- gate box and verdict stamp */
function gateBox(name, line1, line2, t = 0) {
  return P(rect(14, 92, 352, 80, 201), 'violet', t, 600, 1.6) + T(26, 117, name, {h: 1, z: 20, a: 'start', c: 'violet', t: t + 300}) +

}
function stamp(s, ok, x = 356, y = 116, id = 'stamp') {
  const old = s.q('#' + id); if (old) old.remove();
  const g = s.el('g', {id}), txt = ok ? '✓ allowed' : '✗ blocked', w = 78;
  g.innerHTML = `<path d="${rect(x - w, y - 17, w, 24, ok ? 301 : 302)}" fill="${C.bg}" stroke="${ok ? C.green : C.violet}" stroke-width="1.8"/>` +

}
function setLine(s, id, text, c) { const e = s.q('#' + id); if (!e) return; e.textContent = text; if (c) e.setAttribute('fill', K.col(c)); }

/* ---------- the dot that walks a path on the map */
async function walk(s, path, o = {}) {
  const {steps, end} = resolveWalk(path);
  const trail = s.el('g', {}), dot = s.el('circle', {r: 6, fill: C.amber, cx: SPOT['/'][0], cy: SPOT['/'][1]});
  let prev = SPOT['/'];
  for (const st of steps) {
    if (!s.alive() || (o.live && !o.live())) return end;
    if (o.text) setRequest(s, o.op, path, {active: st.part, match: o.match, tag: o.tag, tagC: o.tagC});
    const to = spot(st.at);
    s.el('line', {x1: prev[0], y1: prev[1], x2: to[0], y2: to[1], stroke: C.amber, 'stroke-width': 1.6, 'stroke-opacity': .55, 'stroke-dasharray': st.link ? '3 3' : ''}, trail);
    await s.tween(s.RM ? 0 : (st.link ? 650 : 380), k => { dot.setAttribute('cx', K.lerp(prev[0], to[0], k)); dot.setAttribute('cy', K.lerp(prev[1], to[1], k)); });
    prev = to;
    if (o.say) o.say(st);
    await s.wait(s.RM ? 0 : (o.pause || 160));
  }
  if (!s.alive() || (o.live && !o.live())) return end;
  if (o.text) setRequest(s, o.op, path, {match: o.match, tag: o.tag, tagC: o.tagC});
  const bad = o.bad != null ? o.bad : outsideProject(end);
  dot.setAttribute('fill', bad ? K.C.fill.red : K.C.fill.blue);
  s.el('circle', {cx: prev[0], cy: prev[1], r: 11, fill: 'none', stroke: bad ? C.red : C.blue, 'stroke-width': 2});
  return end;
}

        const judge = async (o = {}) => {
          const me = ++run; s.dyn.innerHTML = '';
          let path = inp.value.trim() || '/'; if (!/^\//.test(path) && sel.value !== 'other') path = '/' + path;
          const op = sel.value, ap = o.approved !== false, pg = prefixGate(op, path, ap), sg = saferGate(op, path, ap);
          const tag = o.item ? `test ${PG.i + 1} of 22: ${o.item.ok ? 'should allow' : 'should block'}` : '';
          const match = pg.need && path.startsWith(pg.need) ? pg.need.length : 0;
          setRequest(s, op, path, {match, tag, tagC: o.item ? (o.item.ok ? 'blue' : 'red') : 'mut'});
          setLine(s, 'pr', pg.why.length > 52 ? pg.why.slice(0, 51) + '…' : pg.why);
          setLine(s, 'sr', sg.why.length > 52 ? sg.why.slice(0, 51) + '…' : sg.why);
          stamp(s, pg.ok, 356, 112, 'st1'); stamp(s, sg.ok, 356, 150, 'st2');
          if (FILE_OPS.includes(op)) { await s.wait(200); if (me === run) await walk(s, path, {bad: !sg.ok, live: () => me === run}); }
        };
        box.appendChild(s.btn('', 'Check', () => judge(), {primary: true}));
        box.appendChild(s.btn('', 'Test request', () => {
          PG.i = (PG.i + 1) % DATA.requests.length; const r = DATA.requests[PG.i];
          inp.value = r.target; sel.value = FILE_OPS.includes(r.op) ? r.op : 'other'; judge({item: r, approved: r.approved !== false});
        }));
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') { s.touched(); judge(); } });
        inp.addEventListener('input', () => s.touched());
        s.at(700, () => judge());
      },
      demo: async s => {
        const inp = s.act.querySelector('input'), sel = s.act.querySelector('select'), chk = s.act.querySelector('button.pri');
        for (const [v, op] of [['/workspace/acme/tmp-other/archive', 'delete'], ['/workspace/acme/tmp/shared-link/../private.txt', 'read'], ['/workspace/acme/output/../.env', 'read']]) {
          await s.wait(600); if (!s.alive()) return; inp.value = v; sel.value = op; s.tap(chk); await s.wait(4400);
        }
      },
      idleDemo: 6000, demoDuration: 16000, duration: 4200 },

    { title: '6. The scoreboard', keys: ['inside', 'outside'],
      cap: 'Filled dot = let through. The prefix gate let 5 of 14 forbidden requests through, all five path tricks. The safer designs let 0 through; the read-only one also blocked 4 of the 8 permitted.',
      draw: () => {
        let m = T(26, 22, '14 forbidden requests', {a: 'start', z: 13.5, c: 'red', t: 100}) + T(236, 22, '8 permitted', {a: 'start', z: 13.5, c: 'blue', t: 100}) +
          T(26, 40, 'filled = gate let it through,  ring = blocked', {a: 'start', z: 13, c: 'mut', t: 200});
        GATES.forEach((g, i) => {
          const y = 70 + i * 66;
          m += T(26, y, g.name, {h: 1, z: 18, a: 'start', c: 'ink', t: 300 + i * 500}) +
            T(194, y + 27, '', {a: 'start', z: 14, c: 'red', id: 'cf' + i, w: 700}) + T(326, y + 27, '', {a: 'start', z: 14, c: 'blue', id: 'cp' + i, w: 700});
        });
        m += T(26, 410, 'The 5 tricks sit first in each red row. Safer gate and', {a: 'start', z: 13, c: 'mut', t: 3400}) +
          T(26, 427, 'exact approvals made identical decisions on all 22.', {a: 'start', z: 13, c: 'mut', t: 3400});
        return m;
      },
      start(s) {
        const items = [];
        GATES.forEach((g, gi) => { FORB.forEach((r, j) => items.push({g: gi, r, j, forb: true})); PERM.forEach((r, j) => items.push({g: gi, r, j, forb: false})); });
        const U = s.units(items, {r: 5, fill: 'faint', x0: 190, y0: 230});
        const lay = it => {
          const y = 70 + it.g * 66 + 22, x = it.forb ? 31 + it.j * 11.6 : 241 + it.j * 10.6, let_ = !!it.r[GATES[it.g].k];
          return {x, y, r: 4.6, fill: 'none', order: it.g * 26 + it.j + (it.forb ? 0 : 14)};
        };
        U.forEach(u => { u.c.setAttribute('stroke-width', 1.6); u.c.setAttribute('stroke', K.C.mut); });
        s.at(400, async () => {
          await s.arrange(lay, {du: 700, stagger: 9});
          if (!s.alive()) return;
          U.forEach(u => { const c = u.it.forb ? K.C.fill.red : K.C.fill.blue, let_ = !!u.it.r[GATES[u.it.g].k]; u.c.setAttribute('stroke', c); u.c.style.fill = let_ ? c : 'transparent'; });
          GATES.forEach((g, i) => { s.count('#cf' + i, COUNTS[i].f, {from: 0, du: 700, post: '/' + FORB.length}); s.count('#cp' + i, COUNTS[i].p, {from: 0, du: 700, post: '/' + PERM.length}); });
          s.at(900, () => s.ring(22, 70 + 66 + 8, 64, 24, 'amber'));
        });
      },
      duration: 4600 },

    { title: '7. What to take away', keys: ['inside', 'outside', 'gate'],
      cap: 'Check where a path really leads, not how it is spelled. The safer gates\u2019 0 is a ceiling by design: the 22 requests were written against the same rules, so they show these tricks are caught, not every attack.',
      draw: () => {
        const rows = [
          ['Follow every .. and shortcut first,', 'then check where the path really ends.'],
          ['Compare whole folder names:', 'tmp-other/ is not inside tmp/.'],
          ['Refuse secret names by name:', '.env, .ssh, credentials, payroll.'],
        ];
        let m = T(26, 30, 'A safer gate does three things', {h: 1, z: 21, a: 'start', c: 'violet'});
        rows.forEach((r, i) => {
          const y = 50 + i * 64;
          m += P(rect(18, y, 344, 54, 400 + i), 'violet', 300 + i * 450, 500, 1.3) + T(36, y + 34, String(i + 1), {h: 1, z: 26, c: 'violet', t: 450 + i * 450}) +
            T(58, y + 22, r[0], {a: 'start', z: 14.5, c: 'ink', t: 500 + i * 450}) + T(58, y + 42, r[1], {a: 'start', z: 14, c: 'mut', t: 550 + i * 450});
        });
        const lim = ['22 hand-written requests, each run once;', 'no real attacker, no live disk in the main test.',
          'Not tested: a shortcut swapped between the', 'check and the delete, hardlinks, escaping', 'the sandbox.'];
        m += P(rect(18, 260, 344, 160, 410), 'faint', 1900, 600, 1.2) + T(30, 284, 'What this test cannot tell you', {h: 1, z: 18, a: 'start', c: 'red', t: 2100});
        lim.forEach((l, i) => { m += T(30, 310 + i * 21, l, {a: 'start', z: 13.5, c: i < 2 ? 'ink' : 'mut', t: 2300 + i * 150}); });
        return m;
      },
      duration: 3600 },
