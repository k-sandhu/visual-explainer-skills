        P(rect(20, 58, 160, 92, 11), 'red', 500, 600) + P(rect(200, 58, 160, 92, 12), 'blue', 650, 600) +
        T(100, 80, 'Answer A', {h: 1, z: 17, t: 900}) + T(280, 80, 'Answer B', {h: 1, z: 17, t: 1000}) +
        T(100, 106, 'if gap >= 8:', {m: 1, z: 13, t: 1200}) + T(280, 106, 'if gap > 8:', {m: 1, z: 13, t: 1300}) +
        T(100, 134, '✗ fails 2 of 64 tests', {z: 12.5, c: 'red', t: 1700}) + T(280, 134, '✓ passes all 64', {z: 12.5, c: 'blue', t: 1850}) +
        T(280, 178, 'code decides: B is better', {h: 1, z: 17, t: 2200}) +
        T(20, 178, 'pair code-000', {m: 1, z: 12, a: 'start', c: 'mut', t: 2200}) +
        P(line(20, 198, 360, 198, 13, .4), 'faint', 2300, 400, 1) +
        FAM.map((f, k) => T(184, 238 + (k * 4 + 1.5) * 10.6 + k * 9 + 4, f + ' · 60', {z: 12.5, a: 'end', c: 'mut', t: 3000 + k * 120})).join(''),
      start(s) {
        const U = s.units(PAIRS.map((p, i) => ({i})), {r: 0, fill: NEUTRAL, x0: 280, y0: 186});
        s.at(2500, () => s.arrange(it => ({...bigPos(it.i), fill: it.i === 0 ? 'ink' : NEUTRAL, order: it.i === 0 ? 0 : 60 + it.i}), {du: 800, stagger: 3}));
        s.at(4400, () => { const b = bigPos(0); s.el('circle', {cx: b.x, cy: b.y, r: 7.5, fill: 'none', stroke: K.C.ink, 'stroke-width': 1.4}); });
      },
      duration: 4800 },

    /* 2 ---------------------------------------------------------------- */
    { title: '2. Every judge, asked twice', keys: ['b', 'o', 'n', 'u'],
      cap: 'Each judge saw the pair twice, with A and B swapped. On code-000, eight judges were right both times. Granite chose the second-shown answer both times, so it was right only once.',
      draw: () => {
        const p = PAIRS[0];
        let m = T(20, 26, 'pair code-000', {m: 1, z: 12.5, a: 'start', c: 'mut'}) +
          T(178, 26, 'better', {z: 12, c: 'mut'}) + T(178, 40, 'shown 2nd', {z: 12, c: 'mut'}) +
          T(250, 26, 'better', {z: 12, c: 'mut'}) + T(250, 40, 'shown 1st', {z: 12, c: 'mut'}) +
          T(330, 40, 'dot', {z: 12, c: 'mut'});
        // order AB = better shown 2nd, BA = better shown 1st (data/judgments.csv, item test-code-000)
        const R = ['✓✓', '✓✓', '✓✓', '✓✓', '✓✓', '✓✓', '✓✓', '✓✓', '✓✗'];
        JN.forEach((n, j) => { const y = 70 + j * 29, t = 300 + j * 90;
          m += T(20, y + 5, n, {h: 1, z: 16, a: 'start', t}) +
            T(178, y + 5, R[j][0], {z: 15, c: R[j][0] === '✓' ? 'blue' : 'red', t: 1300 + j * 70}) +
            T(250, y + 5, R[j][1], {z: 15, c: R[j][1] === '✓' ? 'blue' : 'red', t: 2100 + j * 70}) +
            `<circle cx="330" cy="${y}" r="6.5" fill="${K.col(OUT[p[3][j]])}" data-k="fade" data-t="${2900 + j * 70}" data-d="400"/>`; });
        m += P(line(20, 332, 360, 332, 21, .4), 'faint', 3500, 300, 1);
        const key = [['b', 'right in both orders'], ['o', 'right in one order'], ['n', 'wrong in both orders'], ['u', 'no readable reply']];
        key.forEach(([k, l], q) => { const x = q % 2 ? 200 : 24, y = 360 + Math.floor(q / 2) * 26;
          m += `<circle cx="${x + 6}" cy="${y - 4}" r="6" fill="${K.col(OUT[k])}" data-k="fade" data-t="${3700 + q * 150}" data-d="400"/>` + T(x + 18, y, l, {z: 12.5, a: 'start', t: 3700 + q * 150}); });
        return m;
      },
      start(s) { s.at(3400, () => s.ring(12, 70 + 8 * 29 - 14, 356, 28, 'amber')); },
      duration: 4600 },

    /* 3 ---------------------------------------------------------------- */
    { title: '3. Nine judges, 240 pairs', keys: ['b', 'o', 'n', 'u'],
      cap: 'Same pair, same cell in every grid. Muse was right both times on 238 of 240 pairs; Opus, Sonnet and Sol on 221 to 224. The cheaper judges are spotted with amber: their verdict followed the order.',
      draw: () => wafLabels(1400, SHOW_COUNT),
      start(s) {
        const U = s.units(JUDGE_ITEMS, {r: 2.6, fill: NEUTRAL});
        place(s, U, it => ({...bigPos(it.i), fill: NEUTRAL}));
        s.arrange(it => ({...wafPos(it.j, it.i), order: it.j * 110 + it.i * .5}), {du: 900, stagger: 1, delay: 200})
          .then(() => U.forEach(u => s.at(200 + u.it.j * 110, () => u.c.style.fill = K.col(OUT[PAIRS[u.it.i][3][u.it.j]]))));
      },
      duration: 4400 },

    /* 4 ---------------------------------------------------------------- */
    { title: '4. Misses cluster by task', keys: ['b', 'o', 'n', 'u'], actHeight: 44,
      cap: 'Instructions (third band): all of Opus’s and Sonnet’s misses, and 15 of Sol’s 19, are messages one word over or under an exact count of about 720 words.',
      draw: () => wafLabels(0, SHOW_COUNT),
      start(s) {
        const U = s.units(JUDGE_ITEMS, {r: 2.6});
        place(s, U, it => ({...wafPos(it.j, it.i), fill: OUT[PAIRS[it.i][3][it.j]]}));
        const marks = s.el('g', {});
        const show = (f, cap) => {
          U.forEach(u => u.c.style.opacity = PAIRS[u.it.i][1] === f ? 1 : .16);
          marks.innerHTML = '';
          const js = f === 2 ? [1, 2, 3] : [6, 7, 8];
          js.forEach(j => { const a = wafPos(j, f * 60), b = wafPos(j, f * 60 + 59);
            s.el('path', {d: K.rect(a.x - 5, a.y - 5, b.x - a.x + 10, b.y - a.y + 10, 40 + j), fill: 'none', stroke: K.C.ink, 'stroke-width': 1.3, 'stroke-linecap': 'round'}, marks); });
          s.cap(cap); bs.forEach((b, q) => b.className = q === (f === 2 ? 0 : 1) ? 'pri' : '');
        };
        let manual = false;
        const CAPS = ['Instructions (third band): all of Opus’s and Sonnet’s misses, and 15 of Sol’s 19, are messages one word over or under an exact count of about 720 words.',
          'Calculations (second band): Luna, the Decisions API and Granite were right in only one order on 58 to 60 of 60 pairs. They picked the same slot twice; no arithmetic behind it.'];
        const bs = [s.btn('', 'Word counts', () => { manual = true; show(2, CAPS[0]); }), s.btn('', 'Calculations', () => { manual = true; show(1, CAPS[1]); })];
        s.at(700, () => show(2, CAPS[0]));
        s.at(5600, () => { if (!manual) show(1, CAPS[1]); });
      },
      demo: async s => { s.tap(s.act.querySelectorAll('button')[0]); await s.wait(3500); s.tap(s.act.querySelectorAll('button')[1]); await s.wait(3000); },
      demoDuration: 6500, duration: 10200 },

    /* 5 ---------------------------------------------------------------- */
    { title: '5. The hardest pairs', keys: ['b', 'o', 'n', 'u', 'w'],
      cap: 'Now one dot per pair, stacked by how many of the 9 judges got it right both times. No pair beat all nine. The hard end is mostly word counts (violet).',
      draw: () => {
        let m = P(line(16, 400, 364, 400, 51, .3), 'mut', 0, 500, 1.2);
        for (let k = 0; k < 10; k++) m += T(36 + k * 34.4, 416, String(k), {z: 13, c: 'mut', t: 200 + k * 30});
        m += T(190, 436, 'judges (of 9) right in both orders', {z: 12.5, c: 'mut', t: 500});
        for (let k = 2; k < 10; k++) { const n = HIST.cols[k]; m += T(36 + k * 34.4, 390 - Math.ceil(n / 4) * 8 - 2, String(n), {z: 12, c: 'ink', t: 2600 + k * 60}); }
        m += T(22, 366, 'no pair beat', {h: 1, z: 14, a: 'start', c: 'mut', t: 2800}) + T(22, 385, 'all nine', {h: 1, z: 14, a: 'start', c: 'mut', t: 2850});
        m += `<g id="card"></g>`;
        return m;
      },
      start(s) {
        const U = s.units(JUDGE_ITEMS, {r: 2.6});
        place(s, U, it => ({...wafPos(it.j, it.i), fill: OUT[PAIRS[it.i][3][it.j]]}));
        s.arrange(it => ({...HIST.pos[it.i], fill: PAIRS[it.i][1] === 2 ? 'fill.violet' : NEUTRAL, order: it.i * 2 + it.j * 4}), {du: 1000, stagger: 1, delay: 300});
        const card = s.q('#card'), sel = s.el('circle', {r: 7, fill: 'none', stroke: K.C.ink, 'stroke-width': 1.6, opacity: 0});
        const hint = s.write(190, 120, 'tap a dot to open its pair', {h: 1, z: 18, c: 'mut', t: 2600});
        const open = i => {
          const p = PAIRS[i], h = HIST.pos[i]; hint.style.display = 'none';
          sel.setAttribute('cx', h.x); sel.setAttribute('cy', h.y); sel.setAttribute('opacity', 1);
          let m = `<path d="${K.rect(14, 10, 352, 228, 70)}" fill="${K.C.panel}" stroke="${K.C.line}" stroke-width="1.2"/>` +
            T(26, 36, p[0], {m: 1, z: 14, a: 'start'}) + T(354, 36, FAM[p[1]] + (p[2] ? ' · written separately' : ''), {z: 12, a: 'end', c: 'mut'}) +
            T(26, 60, p[4].replace('; written separately', ''), {z: 13, a: 'start'});
          JN.forEach((n, j) => { const x = 30 + (j % 3) * 112, y = 96 + Math.floor(j / 3) * 26;
            m += `<circle cx="${x}" cy="${y - 4}" r="5.5" fill="${K.col(OUT[p[3][j]])}"/>` + T(x + 12, y, n, {z: 12.5, a: 'start'}); });
          m += T(190, 200, nBoth(p) + ' of 9 judges right in both orders', {h: 1, z: 18});
          card.innerHTML = m; card.querySelectorAll('[data-k]').forEach(e => e.style.opacity = 1);
        };
        const hits = s.el('g', {});
        PAIRS.forEach((p, i) => { const h = HIST.pos[i]; const c = s.el('circle', {cx: h.x, cy: h.y, r: 4.6, fill: 'transparent', 'data-i': i}, hits);
          c.style.cursor = 'pointer'; c.addEventListener('click', ev => { if (ev.isTrusted) s.touched(); open(i); }); });
        s.on(s.el('rect', {x: 0, y: 0, width: 1, height: 1, fill: 'transparent'}), () => open(idx('instructions-008')), 'Open the hardest pair');
        s.hits = hits;
      },
      demo: async s => { for (const id of ['instructions-008', 'code-041', 'code-022']) { s.tap(s.hits.querySelector(`[data-i="${idx(id)}"]`)); await s.wait(2600); } },
      idleDemo: 4200, demoDuration: 8000, duration: 3600 },

    /* 6 ---------------------------------------------------------------- */
    { title: '6. How sure can we be?', keys: [],
      cap: 'Share of 480 single verdicts right, with 95% intervals from resampling the pairs. Muse leads by about 4 points; Opus, Sonnet and Sol overlap and cannot be ranked on this exam.',
      draw: () => {
        const X = K.scale(.5, 1, 118, 318);
        let m = '';
        [.5, .75, 1].forEach((v, q) => m += P(line(X(v), 34, X(v), 336, 60 + q, .2), v === .5 ? 'mut' : 'faint', 0, 500, 1, v === .5 ? 'stroke-dasharray="4 4"' : '') + T(X(v), 352, Math.round(v * 100) + '%', {z: 12, c: 'mut', t: 200}));
        m += T(X(.5), 368, 'coin flip', {h: 1, z: 14, c: 'mut', t: 300});
        ACC.forEach((a, j) => { const y = 50 + j * 32;
          m += T(20, y + 5, JN[j], {h: 1, z: 15, a: 'start', t: 200 + j * 60}) +
            P(line(X(a[1]), y, X(a[2]), y, 70 + j, 0), 'ink', 900 + j * 80, 500, 2.4) +
            T(366, y + 5, (a[0] * 100).toFixed(1) + '%', {z: 12.5, a: 'end', t: 1900 + j * 80}); });
        m += P(rect(10, 50 + 32 - 13, 360, 3 * 32 - 6, 75), 'amber', 2600, 700, 1.3);
        m += T(190, 398, 'overlapping intervals: no ranking', {h: 1, z: 16, c: 'amber', t: 3000});
        m += T(190, 420, 'Muse vs Opus on the same pairs: +3.8 points (1.9 to 5.8)', {z: 12, c: 'mut', t: 3300});
        return m;
      },
      start(s) {
        const X = K.scale(.5, 1, 118, 318);
        s.units(ACC.map((a, j) => ({a, j})), {r: 4.6, fill: 'ink', x0: X(.5)});
        s._units.forEach(u => { u.y = 50 + u.it.j * 32; u.c.setAttribute('cy', u.y); });
        s.arrange(it => ({x: X(it.a[0]), y: 50 + it.j * 32, order: it.j * 60}), {du: 900, stagger: 1, delay: 1000});
      },
      duration: 4000 },

    /* 7 ---------------------------------------------------------------- */
    { title: '7. The catch: one-edit pairs', keys: ['b', 'o', 'n', 'u'],
      cap: '227 of 240 pairs are a right answer and a copy with one small edit, easy to spot side by side. On the 13 code pairs written separately (bright), the cheaper judges fell to 27% to 65% right.',
      draw: () => wafLabels(0, j => SHOW_COUNT(j)),
      start(s) {
        const U = s.units(JUDGE_ITEMS, {r: 2.6});
        place(s, U, it => ({...wafPos(it.j, it.i), fill: OUT[PAIRS[it.i][3][it.j]]}));
        s.at(900, () => U.forEach(u => { if (!PAIRS[u.it.i][2]) u.c.style.opacity = .13; }));
        s.at(1500, () => JN.forEach((n, j) => s.swap('#cnt' + j, Math.round(NAT[j] * 100) + '%', NAT[j] > .9 ? 'blue' : NAT[j] > .7 ? 'ink' : 'red')));
        s.at(1400, () => U.forEach(u => { if (PAIRS[u.it.i][2]) { const r = s.el('circle', {cx: u.x, cy: u.y, r: 4.6, fill: 'none', stroke: K.C.ink, 'stroke-width': .8, opacity: .7}); } }));
      },
      duration: 3200 },

    /* 8 ---------------------------------------------------------------- */
    { title: '8. What to do with a judge', keys: [],
      cap: 'A strong judge is reliable for settling a small, local difference. Swap the order and let code check anything countable. Two answers that differ everywhere still need their own test.',
      draw: () => {
        const rows = [
          ['Ask twice, swap the order', 'A verdict that flips with the order is no verdict.', 'swap'],
          ['Let code count', 'Word counts tripped even the strongest judges.', 'count'],
          ['Strong judges, small diffs', '95% to 99.6% when one edit separates the answers.', 'diff'],
        ];
        let m = '';
        rows.forEach(([h, sub, kind], q) => { const y = 40 + q * 132, t = 300 + q * 900;
          m += P(rect(16, y - 20, 348, 112, 80 + q), 'faint', t, 600, 1.2) + T(108, y + 18, h, {h: 1, z: 20, a: 'start', t: t + 200}) +
            T(108, y + 44, sub.split(' ').slice(0, 5).join(' '), {z: 12.5, a: 'start', c: 'mut', t: t + 400}) +
            T(108, y + 62, sub.split(' ').slice(5).join(' '), {z: 12.5, a: 'start', c: 'mut', t: t + 400});
          if (kind === 'swap') m += T(64, y + 14, 'A  B', {m: 1, z: 15, t: t + 300}) + T(64, y + 40, '⇅', {z: 18, c: 'amber', t: t + 400}) + T(64, y + 66, 'B  A', {m: 1, z: 15, t: t + 500});
          if (kind === 'count') m += T(64, y + 22, '719?', {h: 1, z: 20, c: 'violet', t: t + 300}) + T(64, y + 54, 'len(words)', {m: 1, z: 12, t: t + 500});
          if (kind === 'diff') m += T(64, y + 22, '> 8', {m: 1, z: 15, c: 'blue', t: t + 300}) + T(64, y + 54, '>= 8', {m: 1, z: 15, c: 'red', t: t + 500});
        });
        return m;
      },
      duration: 3600 },
  ],
});

</script>
</body></html>
