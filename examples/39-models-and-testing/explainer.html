/* ---------- step context: everything a step needs, bound to its generation */

        [[.25, '×¼'], [.5, '×½'], [1, '×1'], [2, '×2'], [4, '×4']].forEach(([v, l], j) => {
          s += `<line x1="${XR(v)}" x2="${XR(v)}" y1="${RAX}" y2="${RAX + 5}" stroke="${C.mut}"/>` + T(XR(v), RAX + 20, l, {z: 13, c: 'mut', t: 150 + j * 60});
        });
        s += T(12, RAX + 44, '← one reply faster', {a: 'start', z: 13, c: 'mut', t: 400}) + T(368, RAX + 44, 'one reply slower →', {a: 'end', z: 13, c: 'mut', t: 400});
        s += `<line id="meanl" x1="${XR(SOL.geo)}" x2="${XR(SOL.geo)}" y1="176" y2="${RAX}" stroke="${C.amber}" stroke-width="1.8" stroke-dasharray="4 3" data-k="fade" data-t="2600" data-d="500"/>`;
        s += T(20, 156, `${nFaster} faster in one reply`, {a: 'start', z: 14, h: 1, t: 2900});
        s += T(366, 140, `${nSlower} slower in one reply`, {a: 'end', z: 14, h: 1, t: 3000});
        s += T(366, 158, `${nTwiceSlow} of them over twice as slow`, {a: 'end', z: 14, h: 1, c: 'red', t: 3100});
        s += P(rect(12, 30, 356, 82, 70), 'faint', 300, 500, 1.2);
        s += `<g id="card">` + T(24, 54, `Average: one reply took ${SOL.geo}× as long`, {a: 'start', z: 15, t: 2700}) +
             T(24, 74, `95% range ${fx(SOL.lo)} to ${fx(SOL.hi)} (shaded band)`, {a: 'start', z: 13, c: 'mut', t: 2800}) +
             T(24, 98, 'Tap any dot to see that program.', {a: 'start', z: 13, c: 'violet', t: 3200}) + `</g>`;
        return s;
      },
      start(s) {
        const U = s.units(PAIRS, {r: RR, fill: C.mut, x0: XR(1), y0: RAX - 8});
        U.forEach(u => { u.c.style.opacity = 0; });
        s.at(600, () => s.arrange((p, j) => ({x: SWARM[j].x, y: SWARM[j].y, opacity: .95}), {du: 1100, stagger: 9}));
        s.at(2500, () => U.forEach(u => { if (u.it.r > 2) u.c.style.fill = C.fill.red; else if (u.it.r < .5) u.c.style.fill = C.fill.green; }));
        let sel = null;
        const show = j => {
          const p = PAIRS[j], card = s.q('#card');
          card.innerHTML = S_(T(24, 52, `${p.ver}, task “${p.task}”`, {a: 'start', z: 15})) +
            S_(T(24, 71, `session ${secs(p.ses)}  ·  one reply ${secs(p.one)}`, {a: 'start', z: 13, c: 'mut'})) +
            S_(T(24, 90, ratioWords(p.r), {a: 'start', z: 14, c: p.r > 2 ? 'red' : p.r < .5 ? 'green' : 'ink'})) +
            S_(T(24, 107, NOTES[p.task + '|' + p.ver] || '', {a: 'start', z: 13, c: 'mut'}));
          if (sel) sel.remove();
          sel = s.el('circle', {cx: SWARM[j].x, cy: SWARM[j].y, r: RR + 3.5, fill: 'none', stroke: C.ink, 'stroke-width': 1.8});
        };
        s.at(2000, () => PAIRS.forEach((p, j) => {
          const h = s.el('circle', {cx: SWARM[j].x, cy: SWARM[j].y, r: RR + 1.5, fill: 'transparent'});
          s.on(h, () => show(j), `${p.ver} ${p.task}: ${ratioWords(p.r)}`); h.id = 'hit-' + j;
        }));
      },
      demo: async s => {
        const find = (t, v) => PAIRS.findIndex(p => p.task === t && p.ver === v);
        for (const [t, v] of [['routes', 'NumPy Python'], ['wordpairs', 'Go'], ['heat', 'Plain Python']]) { s.tap('#hit-' + find(t, v)); await s.wait(1900); }
      },
      idleDemo: 6000, demoDuration: 6000, duration: 3600 },

    /* 7 ------------------------------------------------------------------ */
    { title: '7. What fast code costs', keys: ['session', 'reply'],
      cap: `Cost of all 64 programs at list price. Testing raised Sol’s bill from USD 4.55 to 11.2. The fastest code cost most: Opus USD 40, five times Sonnet for about a quarter less run time; Fable USD 58.93.`,
      draw: () => {
        const sc = 143 / 70;
        let s = T(12, 46, 'Cost for 64 programs, and speed index', {a: 'start', z: 16, h: 1});
        COST.forEach((c, j) => {
          const y = 92 + j * 52, t = 300 + j * 250, w = c.usd * sc;
          s += T(12, y - 3, c.name, {a: 'start', z: 14, c: c.how === 'reply' ? 'amber' : 'ink', t});
          s += T(12, y + 15, `speed index ${fx(c.idx)}`, {a: 'start', z: 13, c: 'mut', t: t + 80});
          s += `<rect id="cb${j}" x="150" y="${y - 10}" width="${w.toFixed(1)}" height="16" rx="2" fill="${c.how === 'reply' ? C.fill.amber : C.fill.blue}" style="transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)"/>`;
          s += T(150 + w + 6, y + 3, 'USD ' + c.usd, {a: 'start', z: 14, t: t + 400});
        });
        s += `<line x1="150" x2="150" y1="76" y2="318" stroke="${C.mut}"/>`;
        s += P(line(248, 84, 248, 136, 90, .3), 'violet', 2000, 400, 1.4) + T(256, 115, `${costRatioSol.toFixed(1)}× the cost`, {a: 'start', z: 15, h: 1, c: 'violet', t: 2200});
        s += P(line(300, 188, 300, 240, 91, .3), 'violet', 2400, 400, 1.4) + T(306, 219, `${Math.round(costRatioOpusSonnet)}× Sonnet`, {a: 'start', z: 15, h: 1, c: 'violet', t: 2600});
        s += T(190, 352, 'Lower speed index = faster programs.', {z: 13, c: 'mut', t: 2800});
        s += T(190, 372, 'Muse ran on a subscription and is left out.', {z: 13, c: 'mut', t: 2900});
        return s;
      },
      start(s) { COST.forEach((c, j) => s.at(500 + j * 250, () => s.bar('#cb' + j, 1, 600, 'x'))); },
      duration: 3300 },

    /* 8 ------------------------------------------------------------------ */
    { title: '8. What to take away', keys: ['session', 'reply'],
      cap: 'Pick the model first: the larger model in each family wrote faster code. Then let it test when a slow program would hurt, and take one reply when cost matters more than an occasional slow program.',
      draw: () =>
        P(rect(12, 36, 356, 104, 81), 'blue', 0, 600) +
        T(24, 62, 'If a slow program would hurt:', {a: 'start', z: 18, h: 1, c: 'blue', t: 300}) +
        T(24, 86, 'let the model build and test it. Sol’s', {a: 'start', z: 14, t: 500}) +
        T(24, 104, `sessions avoided ${nTwiceSlow} of ${N} programs that ran`, {a: 'start', z: 14, t: 600}) +
        T(24, 122, 'over twice as long in one reply.', {a: 'start', z: 14, t: 700}) +
        P(rect(12, 152, 356, 104, 82), 'amber', 900, 600) +
        T(24, 178, 'If cost matters more:', {a: 'start', z: 18, h: 1, c: 'amber', t: 1200}) +
        T(24, 202, `one reply took ${SOL.geo} times as long on`, {a: 'start', z: 14, t: 1400}) +
        T(24, 220, 'average, at less than half the price', {a: 'start', z: 14, t: 1500}) +
        T(24, 238, `(USD ${COST[0].usd} against ${COST[1].usd} for 64).`, {a: 'start', z: 14, t: 1600}) +
        T(12, 284, 'What this test cannot say', {a: 'start', z: 16, h: 1, c: 'mut', t: 1900}) +
        T(12, 306, '• Each model wrote each program once.', {a: 'start', z: 13, c: 'mut', t: 2100}) +
        T(12, 325, '• Only Sol was measured both ways.', {a: 'start', z: 13, c: 'mut', t: 2200}) +
        T(12, 344, '• Fable and Astra got a more exact prompt.', {a: 'start', z: 13, c: 'mut', t: 2300}) +
        T(12, 363, '• One reply can be fast: Fable’s matched Opus.', {a: 'start', z: 13, c: 'mut', t: 2400}),
      duration: 3000 },
  ],
});
