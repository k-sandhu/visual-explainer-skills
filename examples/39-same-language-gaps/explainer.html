        o.cards.forEach((c, i) => {
          const vs = rows.filter(r => r.k === c.id).map(r => r.v);
          const txt = (c.fast ? 'Faster: ' : 'Slower: ') + (c.tagV != null ? sec(c.tagV) + ' s' : vs.length > 1 ? range(vs) : sec(vs[0]) + ' s');
          s.write(L.cardX[i] + 12, L.cardY + L.cardH - 10, txt, {z: 13, a: 'start', c: c.fast ? 'blue' : 'red', w: 700, t: 350});
        });

      };
      o.cards.forEach(c => s.on('#hit' + c.id, () => go(c.id), `Pick ${c.id}: ${c.head}`));
    },
    demo: async s => { await s.wait(300); s.tap('#hit' + (o.demoPick || F_.id)); await s.wait(3000); },
    demoDuration: 3600, duration: 2000,
  };
}

function barChart(s, rows, xs, kindCol) {
  rows.forEach((r, j) => {

    b.style.transformBox = 'fill-box'; b.style.transformOrigin = '0 50%'; b.style.transform = 'scaleX(0)';

    s.write(L.barX + w + 4, y + 4.5, sec(r.v), {z: 13, a: 'start', m: 1, c: 'ink', t: j * 90 + 600});
