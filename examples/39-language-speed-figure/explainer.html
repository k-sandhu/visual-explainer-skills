      let m = P(rect(14, 18, 150, 92, 501), 'ink', 0, 500, 1.5) + T(26, 42, 'the job', {h: 1, z: 18, a: 'start', t: 200}) +
        T(26, 66, 'every morning,', {z: 14, a: 'start', t: 300}) + T(26, 84, 'summarise a huge', {z: 14, a: 'start', t: 350}) + T(26, 102, 'web server log', {z: 14, a: 'start', t: 400});
      m += P(line(168, 62, 204, 62, 502), 'mut', 500, 300, 1.6) + P(arrow(168, 62, 206, 62, 503), 'mut', 750, 150, 1.6);
      m += P(rect(210, 34, 156, 56, 504), 'ink', 700, 500, 1.6) + T(288, 69, 'AI model', {h: 1, z: 18, t: 900});
      m += T(190, 140, 'writes the same program in 8 versions', {z: 14, t: 1100});
      LANGS.forEach(([k, name], i) => {
        const x = 12 + (i % 3) * 121, y = 154 + Math.floor(i / 3) * 34, t = 1200 + 60 * i, ref = k === 'simple';
        m += P(rect(x, y, 114, 26, 510 + i), ref ? 'mut' : 'faint', t, 300, 1.3) + T(x + 57, y + 18, name, {z: 14, c: ref ? 'mut' : 'ink', t: t + 100});
      });
      m += T(12, 274, 'Basic Python: a plain reference, for comparison', {z: 14, a: 'start', c: 'mut', t: 1800});
      m += P(K.ellipse(44, 312, 18, 18, 520), 'ink', 1900, 400, 1.6) + P(rect(39, 288, 10, 5, 521), 'ink', 1950, 200, 1.4) +
        P(line(44, 312, 44, 300, 522), 'ink', 2100, 200, 1.6) + P(line(44, 312, 53, 316, 523), 'ink', 2150, 200, 1.6);
      m += T(76, 308, 'each version is timed on', {z: 14, a: 'start', t: 2000}) + T(76, 326, 'the same laptop, same input', {z: 14, a: 'start', t: 2050});
      [1, 2, 10, 100].forEach((v, i) => { m += `<line x1="${X(v)}" x2="${X(v)}" y1="356" y2="364" stroke="${C.mut}" stroke-width="1.4" data-k="fade" data-t="${2300 + 60 * i}" data-d="300"/>` + T(X(v), 382, v + '×', {z: 14, c: 'mut', t: 2300 + 60 * i}); });
      m += P(line(X(1), 360, X(XMAX), 360, 524), 'mut', 2200, 500, 1.4);
      m += T(X(1) - 8, 365, 'fastest', {z: 14, a: 'end', t: 2400});
      m += T(X(1), 404, '× = how many times as long as the fastest version', {z: 14, a: 'start', c: 'mut', t: 2500}).replace('x="' + X(1) + '"', 'x="12"');
      m += T(190, 436, 'On thousands of files, slow code costs money.', {z: 14, t: 2700});
      m += T(190, 458, 'How much slower is each language?', {h: 1, z: 18, t: 2850});
      return m;
    },
  },
  title: 'How much slower than the fastest version?',
  cap: capFor('all'), extraCaptions: extra,
  alt: 'Dot chart on a log scale. Each dot is one AI model\'s program in one language, as a multiple of that model\'s fastest version of the same task. Rust, C++ and Go average about 1.2 to 1.4 times the fastest; Python about 31 times. A row of buttons switches between all tasks and each of eight tasks.',
  legend: [{key: 'a', label: 'One model, one task, timed 2026-11-08', color: 'fill.blue'}, {key: 'b', label: 'Same, timed 2026-11-12 (times \u00f7 0.938)', color: 'fill.amber'}],
  actHeight: 150,
  draw: () => {
    let m = T(12, 30, '1\u00d7 = that model\'s fastest version of the task', {h: 1, z: 17, a: 'start', c: 'mut'});
    m += T(12, 52, 'Each dot = one program. Right = slower.', {z: 14, a: 'start', c: 'mut', t: 200});
    [1, 2, 10, 100].forEach(v => {
      m += `<line x1="${X(v)}" x2="${X(v)}" y1="${ROW0 - 8}" y2="${ROW0 + ROWS * RH - 6}" stroke="${C.line}" stroke-width="${v === 1 ? 1.6 : 1}" stroke-dasharray="${v === 1 ? '' : '3 4'}"/>`;
      m += T(X(v), ROW0 - 18, v + '\u00d7', {z: 14, a: 'middle', c: 'mut', t: 300});
    });
    LANGS.forEach(([k, name], i) => { m += T(12, ROW0 + i * RH + 18, name, {z: 15, a: 'start', t: 400 + i * 40}); });
    return m + '<g id="rows"></g><g id="vals"></g>';
  },
  start(s) {
    const rows = s.q('#rows'), vals = s.q('#vals');
    const paint = task => {
      cur = task; const d = select(task); rows.innerHTML = ''; vals.innerHTML = '';
      d.forEach((x, i) => {
        const yc = ROW0 + i * RH + 12, rnd = K.rng(100 + i);
        const dots = Math.min(x.n, 104) > 20 ? 1.9 : 3.2;
        x.rs.forEach(r => {
          const cx = X(r[3]), cy = yc + (rnd() - .5) * (x.n > 20 ? 20 : 14), day2 = DAY2.has(r[1]);
          const c = document.createElementNS(K.NS, 'circle');
          c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', dots);
          if (day2) { c.setAttribute('fill', 'none'); c.setAttribute('stroke', C.fill.amber); c.setAttribute('stroke-width', 1.3); }
          else { c.setAttribute('fill', C.fill.blue); c.setAttribute('fill-opacity', .7); }
          rows.appendChild(c);
        });
        const mk = document.createElementNS(K.NS, 'line');
        mk.setAttribute('x1', X(x.g)); mk.setAttribute('x2', X(x.g)); mk.setAttribute('y1', yc - 12); mk.setAttribute('y2', yc + 12);
        mk.setAttribute('stroke', C.ink); mk.setAttribute('stroke-width', 3); rows.appendChild(mk);
        const t = document.createElementNS(K.NS, 'text'), right = X(x.g) < 250;
        t.setAttribute('x', X(x.g) + (right ? 7 : -7)); t.setAttribute('y', yc + 22 > ROW0 + ROWS * RH ? yc + 5 : yc - 13);
        t.setAttribute('text-anchor', right ? 'start' : 'end'); t.setAttribute('fill', C.ink); t.setAttribute('font-size', 14);
        t.setAttribute('font-weight', 700); t.textContent = fx(x.g); vals.appendChild(t);
      });
      s.cap(capFor(task));
      [...s.act.querySelectorAll('button')].forEach(b => { b.className = b.dataset.t === task ? 'pri' : ''; b.setAttribute('aria-pressed', b.dataset.t === task); });
    };
    [['all', 'All tasks'], ...TASKS.map(t => [t[0], t[0]])].forEach(([k, label]) => {
      const b = s.btn('', label, () => paint(k)); b.dataset.t = k;
    });
    paint(cur);
  },
  demo: async s => { for (const k of ['heat', 'wordpairs', 'all']) { const b = s.q ? s.act.querySelector(`[data-t="${k}"]`) : null; if (b) s.tap(b); await s.wait(1800); } },
  idleDemo: 7000, demoDuration: 5600, duration: 1800,
});
</script>
