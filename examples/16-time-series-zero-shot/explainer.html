        T(X21(420), 278, 'avg ' + fmt(avgW2) + ' MW', {h: 1, z: 15, c: 'amber', id: 'yv'}) +
        T(190, 312, 'drag up or down inside the grey area', {z: 13, c: 'mut', id: 'hint'}) +
        `<rect id="hit" x="${X21(336)}" y="48" width="${X21(504) - X21(336)}" height="192" fill="transparent"/>`,
      start(s) {
        let shift = G.shift == null ? 0 : G.shift, y0 = null, s0 = 0, rev;
        const gg = s.q('#gg');
        const set = v => {
          shift = K.clamp(Math.round(v / 10) * 10, -4500, 3000);
          G.shift = shift;
          gg.setAttribute('transform', `translate(0 ${dyOf(shift).toFixed(1)})`);
          s.q('#yv').textContent = 'avg ' + fmt(avgW2 + shift) + ' MW';
          s.q('#hint').textContent = 'your guess: ' + (shift > 0 ? '+' : shift < 0 ? '−' : '') + fmt(Math.abs(shift)) + ' MW compared with last week';
          if (rev) rev.disabled = false;
        };
        s.drag('#hit', {
          move(p) { if (y0 == null) { y0 = p.y; s0 = shift; } set(s0 + (Y.invert(p.y) - Y.invert(y0))); },
          end() { y0 = null; },
        });
        s.btn('', '▼ Lower', () => set(shift - 250));
        s.btn('', '▲ Higher', () => set(shift + 250));
        rev = s.btn('check', 'Reveal', () => API.go(4), {primary: true});   // index 4 = '4. The real week' (the intro is index 0)
        rev.disabled = G.shift == null;
        if (G.shift != null) set(G.shift);
      },
      demo: async s => {
        const target = EXAMPLE_SHIFT;   // example guess: about last week's drop again, in 250 MW button steps
        const btn = s.act.querySelector('button');
        s.cap(CAP3);
        for (let v = 0; v > target; v -= 250) { s.tap(btn); await s.wait(260); }
        await s.wait(700);
      },
      demoDuration: 3000, duration: 1200 },

    /* 4 ---------------------------------------------------------------- */
    { title: '4. The real week', keys: ['rec', 'naive', 'you'],
      cap: `The real week used less power: ${fmt(avgA)} MW on average, ${fmt(avgW2 - avgA)} below last week, so the copy was too high in ${over} of 168 hours. The score is the average miss per hour.`,
      draw: () => {
        const g = G.shift;
        let s = frame21({hideOp: .1, nextLabel: 'next week: revealed', nextC: 'ink'}) + histStatic() + avgRow() +
          `<path d="${pth(N, 336, X21)}" fill="none" stroke="${C.blue}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".85"/>`;
        if (g != null) s += `<path d="${pth(N, 336, X21)}" transform="translate(0 ${dyOf(g).toFixed(1)})" fill="none" stroke="${C.amber}" stroke-width="1.4" stroke-dasharray="5 3" opacity=".75"/>`;
        s += P(pth(A, 336, X21), 'ink', 700, 1500, 1.6);
        s += T(X21(420), 278, 'avg ' + fmt(avgA) + ' MW', {h: 1, z: 15, c: 'ink', t: 2300});
        s += T(46, 300, 'average miss per hour', {z: 13, a: 'start', c: 'mut', t: 2700});
        s += T(46, 319, 'repeat last week: ' + fmt(maeN) + ' MW', {z: 14, a: 'start', c: 'blue', t: 2900, w: 600});
        s += T(366, 319, g == null ? 'you: no guess' : 'you: ' + fmt(mae(N.map(v => v + g))) + ' MW', {z: 14, a: 'end', c: 'amber', t: 3200, w: 600});
        return s;
      },
      start(s) {
        if (G.shift != null) s.btn('restart', 'Try another guess', () => { G.shift = null; API.go(3); });
      },
      duration: 3600 },

    /* 5 ---------------------------------------------------------------- */
    { title: '5. A pretrained model tries', keys: ['rec', 'naive', 'model', 'you', 'gap'],
      cap: `Chronos-2, a pretrained model, saw only the previous 512 hourly numbers. It missed by ${fmt(maeC)} MW per hour, ${pct(lessC)} less than the copy. Its shaded 80% band held the real value in ${inBand} of 168 hours.`,
      draw: () => {
        const g = G.shift, days = ['Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed'];
        let s = yAxis() + `<line x1="46" x2="366" y1="240" y2="240" stroke="${C.line}"/>` +
          days.map((d, i) => T(X7(12 + 24 * i), 256, d, {z: 13, c: 'mut'}) + (i ? `<line x1="${X7(24 * i)}" x2="${X7(24 * i)}" y1="234" y2="240" stroke="${C.line}"/>` : '')).join('') +
          T(206, 42, 'next week, Aug 20-26, zoomed in', {h: 1, z: 15, c: 'mut'});
        s += F(bandPath(), C.fill.violet, 300, {op: .3});
        s += `<path d="${pth(N, 0, X7)}" fill="none" stroke="${C.blue}" stroke-width="1.3" stroke-dasharray="4 3" opacity=".85"/>`;
        s += `<path d="${pth(A, 0, X7)}" fill="none" stroke="${C.ink}" stroke-width="1.6"/>`;
        s += P(pth(CH, 0, X7), 'violet', 700, 1400, 1.8);
        // the miss of the copy at 5 p.m. on the first day
        s += P(`M${X7(hr17) + 3} ${Y(N[hr17])}L${X7(hr17) + 3} ${Y(A[hr17])}`, 'red', 2300, 300, 2.4);
        s += T(X7(hr17) + 10, Y(N[hr17]) + 3, 'copy too high by ' + fmt(gap17) + ' MW (Thu 5 pm)', {z: 13, a: 'start', c: 'red', t: 2500});
        // average miss bars
        const BX = K.scale(0, 2400, 150, 296), rows = [['repeat last week', maeN, 'blue', C.fill.blue], ['Chronos-2', maeC, 'violet', C.fill.violet]];
        if (g != null) rows.push(['your guess', mae(N.map(v => v + g)), 'amber', C.fill.amber]);
        s += T(46, 278, 'average miss per hour', {z: 13, a: 'start', c: 'mut', t: 2600});
        rows.forEach((r, i) => {
          const y = 293 + i * 15, w = (BX(Math.min(r[1], 2400)) - 150).toFixed(1);
          s += T(144, y + 4.5, r[0], {z: 13, a: 'end', c: r[2], t: 2700 + i * 150});
          s += `<rect class="mb" x="150" y="${y - 5}" width="${w}" height="10" rx="2" fill="${r[3]}" style="transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)"/>`;
          s += T(150 + +w + 5, y + 4.5, fmt(r[1]) + ' MW', {z: 13, a: 'start', c: r[2], t: 3300 + i * 150});
        });
        return s;
      },
      start(s) { [...s.root.querySelectorAll('.mb')].forEach((b, i) => s.at(2800 + i * 150, () => s.bar(b, 1, 700))); },
      duration: 4000 },

    /* 6 ---------------------------------------------------------------- */
    { title: '6. Now guess the big number', keys: ['you', 'model'], ask: true,
      cap: 'Over six series (Ontario demand, Toronto temperature and wind, two Wikipedia pages, USD/CAD), how much less error did the best pretrained model make than repeating the last cycle? Drag, then Reveal.',
      draw: () =>
        T(190, 44, 'less error than repeating the last cycle', {h: 1, z: 17}) +
        `<line x1="40" x2="350" y1="160" y2="160" stroke="${C.ink}" stroke-width="1.2"/>` +
        [0, 10, 20, 30, 40, 50, 60].map(v => `<line x1="${S6(v)}" x2="${S6(v)}" y1="155" y2="165" stroke="${C.mut}"/>` + T(S6(v), 181, v + '%', {z: 13, c: 'mut'})).join('') +
        T(40, 198, 'no better', {z: 13, a: 'start', c: 'mut'}) + T(S6(50), 198, 'half the error', {z: 13, c: 'mut'}) +
        `<g id="gm" style="opacity:0"><line x1="0" x2="0" y1="122" y2="160" stroke="${C.amber}" stroke-width="2.2"/><path d="M-8 111h16l-8 10z" fill="${C.amber}"/></g>` +
        T(190, 90, 'drag along the line', {z: 15, c: 'amber', id: 'gv', w: 600}) +
        `<rect id="hit6" x="28" y="100" width="334" height="80" fill="transparent"/>` +
        `<g id="res" style="opacity:0;transition:opacity .6s"></g>`,
      start(s) {
        const gm = s.q('#gm');
        let rev, again;
        const place = v => { if (G.pctShown) return; G.pct = K.clamp(Math.round(v), 0, 60); gm.style.opacity = 1; gm.setAttribute('transform', `translate(${S6(G.pct)} 0)`);
          s.q('#gv').textContent = 'your guess: ' + G.pct + '% less error'; if (rev) rev.disabled = false; };
        const reveal = () => {
          G.pctShown = true; rev.disabled = true;
          const res = s.q('#res'), rows = [
            ['Chronos-2, all six series', skillAll, [skillLo, skillHi]],
            ['Chronos-2, Ontario demand, 20 forecast starts', skillOnt],
            ['Chronos-2, the one Ontario week you saw', lessC]];
          res.innerHTML = rows.map((r, i) => {
            const y = 234 + i * 33, endX = r[2] ? S6(r[2][1]) : S6(r[1]);
            return T(40, y - 9, K.esc(r[0]) + `: <tspan fill="${C.violet}" font-weight="700">${pct(r[1])}</tspan>` + (r[2] ? ` (95% range ${Math.round(r[2][0])}-${pct(r[2][1])})` : ''), {z: 13, a: 'start', c: 'mut', raw: 1}) +
              (r[2] ? `<line x1="${S6(r[2][0])}" x2="${S6(r[2][1])}" y1="${y + 4}" y2="${y + 4}" stroke="${C.violet}" stroke-width="1.2"/>` +
                `<line x1="${S6(r[2][0])}" x2="${S6(r[2][0])}" y1="${y - 1}" y2="${y + 9}" stroke="${C.violet}"/><line x1="${S6(r[2][1])}" x2="${S6(r[2][1])}" y1="${y - 1}" y2="${y + 9}" stroke="${C.violet}"/>` : '') +
              `<line x1="40" x2="${S6(r[1])}" y1="${y + 4}" y2="${y + 4}" stroke="${C.violet}" stroke-width="3"/>` +
              `<circle cx="${S6(r[1])}" cy="${y + 4}" r="5" fill="${C.fill.violet}"/>` +
              '';
          }).join('') + (G.pct == null ? '' : [0, 1, 2].map(i => `<line x1="${S6(G.pct)}" x2="${S6(G.pct)}" y1="${234 + i * 33 - 1}" y2="${234 + i * 33 + 9}" stroke="${C.amber}" stroke-width="2.2"/>`).join(''));
          res.style.opacity = 1;
          s.q('#gv').textContent = G.pct == null ? 'Chronos-2: ' + pct(skillAll) + ' less error overall' : 'you: ' + G.pct + '%   ·   Chronos-2 overall: ' + pct(skillAll);
        };
        s.drag('#hit6', { move(p) { place(S6.invert(p.x)); } });
        rev = s.btn('check', 'Reveal', reveal, {primary: true});
        again = s.btn('restart', 'Guess again', () => { G.pct = null; G.pctShown = false; API.go(6); });
        rev.disabled = G.pct == null;
        if (G.pct != null) { const keep = G.pctShown; G.pctShown = false; place(G.pct); if (keep) reveal(); }
        s._place = place;
      },
      demo: async s => {   // example guess of 40%, then Reveal
        s.cap(CAP6);
        for (let v = 5; v <= 40; v += 5) { s._place(v); await s.wait(90); }
        await s.wait(900);
        s.tap(s.act.querySelector('button.pri'));
        await s.wait(1600);
      },
      demoDuration: 3400, duration: 1200 },

    /* 7 ---------------------------------------------------------------- */
    { title: '7. Every method, scored', keys: ['naive', 'model', 'fit'],
      cap: `Error relative to repeating the last cycle (below 1 = better). Dot: average of six series, line: its 95% range. Ring: Ontario demand alone. The top four sit within ${spread4.toFixed(3)} of each other.`,
      draw: () => {
        const RX = K.scale(.6, 1.4, 128, 326), rows = DATA.board;
        let s = `<circle cx="134" cy="26" r="4.6" fill="${C.ink}"/>` + T(144, 30.5, 'six series', {z: 13, a: 'start'}) +
          `<circle cx="234" cy="26" r="4.6" fill="none" stroke="${C.ink}" stroke-width="1.6"/>` + T(244, 30.5, 'Ontario demand', {z: 13, a: 'start'}) +
          `<line x1="${RX(1)}" x2="${RX(1)}" y1="40" y2="276" stroke="${C.blue}" stroke-dasharray="3 3" opacity=".8"/>` +
          [.6, .8, 1, 1.2, 1.4].map(v => T(RX(v), 293, v.toFixed(1), {z: 13, c: 'mut'})).join('') +
          `<line x1="128" x2="326" y1="278" y2="278" stroke="${C.line}"/>` +
          T(RX(1) - 6, 314, '← less error', {z: 13, a: 'end', c: 'mut'}) + T(RX(1) + 6, 314, 'more error →', {z: 13, a: 'start', c: 'mut'});
        rows.forEach((r, i) => {
          const y = 52 + i * 19, c = kind(r.m), t = 300 + i * 120, cl = v => Math.min(v, 1.4);
          s += T(122, y + 4.5, r.m === 'Seasonal naive' ? 'Repeat last cycle' : r.m, {z: 13, a: 'end', c, t});
          if (r.m !== 'Seasonal naive') s += `<line x1="${RX(r.lo)}" x2="${RX(cl(r.hi))}" y1="${y}" y2="${y}" stroke="${K.col(c)}" stroke-width="1.2" opacity=".65"/>`;
          s += `<circle cx="${RX(cl(r.all))}" cy="${y}" r="4.6" fill="${K.col('fill.' + c)}"/>`;
          if (r.m !== 'Seasonal naive') {
            s += `<circle cx="${RX(cl(r.ont))}" cy="${y}" r="4.6" fill="none" stroke="${K.col(c)}" stroke-width="1.6"/>`;
            if (r.ont > 1.4) s += T(333, y + 4.5, r.ont.toFixed(2), {z: 13, a: 'start', c});
          }
        });
        return s;
      },
      duration: 2400 },

    /* 8 ---------------------------------------------------------------- */
    { title: '8. What to take from it', keys: [],
      cap: 'Expect a clear gain over "repeat the last cycle" only on series with a strong cycle, and check the bands before trusting them. One week, like the one you guessed, is one draw.',
      draw: () => {
        const L = [
          [0, 'Best pretrained models: about ' + pct(skillAll) + ' less error', 'ink'],
          [0.8, 'than repeating the last cycle, over six series', 'mut'],
          [2, 'Ontario demand, top four: ' + pct(Math.min(...ontLead)) + '-' + pct(Math.max(...ontLead)) + ' less error', 'ink'],
          [3, 'AI page views and USD/CAD: all ' + lead5LoseAiFx + ' leaders', 'ink'],
          [3.8, 'did worse than repeating the last cycle', 'mut'],
          [5, 'Their 80% bands held only ' + Math.round(BAND_COVER[0]) + '-' + Math.round(BAND_COVER[1]) + '% of values', 'ink'],
          [6, 'This week AutoARIMA beat ' + arimaBeats + ' of 5 leaders;', 'ink'],
          [6.8, 'over all Ontario starts it lost (' + B['AutoARIMA'].ont.toFixed(2) + ')', 'mut'],
        ];
        let s = L.map((l, i) => T(22, 38 + l[0] * 31, l[1], {h: 1, z: 18, a: 'start', c: l[2], t: 300 + i * 300})).join('');
        s += T(190, 292, '6 series · 112 forecast starts · Aug 20 to Oct 17, 2026', {z: 13, c: 'mut', t: 2900});
        s += T(190, 311, 'models saw numbers only: no dates, holidays, weather', {z: 13, c: 'mut', t: 3100});
        return s;
      },
      duration: 3600 },
  ],
});

</script>
</body></html>
