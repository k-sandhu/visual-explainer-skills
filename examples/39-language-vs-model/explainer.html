    m += T(X(v), AXY + 18, (v < 1 ? v : v.toFixed(0)) + ' s', {z: 13, c: 'mut', t: t0 + 200 + i * 80});
  });
  m += T(PX1, AXY + 38, 'run time; each grid line is 10× the last', {z: 13, c: 'mut', a: 'end', t: t0 + 500});
  return m;
}
/* meter: how much of the variation is left once dots are compared with their own group's average */
function meter(task) {
  return T(16, 30, task + ': 20 programs', {h: 1, z: 20, a: 'start', c: 'ink'}) +
    T(16, 52, 'Variation left: 100%', {z: 14, a: 'start', id: 'mtxt'}) +
    `<rect x="200" y="40" width="160" height="14" rx="2" fill="${C.faint}" fill-opacity=".9"/>` +
    `<rect id="mbar" x="200" y="40" width="160" height="14" rx="2" fill="${C.fill.blue}" style="transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0)"/>` +
    P(rect(200, 40, 160, 14, 5), 'mut', 0, 400, 1) +
    T(360, 72, '', {z: 13, a: 'end', id: 'mrem', c: 'blue'});
}

/* beeswarm: place dots on a row without overlap */
function swarm(pts, y0, r, maxOff) {
  const placed = [], out = [];
  pts.map((p, i) => ({...p, i})).sort((a, b) => a.x - b.x).forEach(p => {
    const offs = [0]; for (let k = 1; k < 12; k++) offs.push(k * r * 1.7, -k * r * 1.7);
    let dy = 0;
    for (const o of offs) { if (Math.abs(o) > maxOff) continue; if (placed.every(q => (q.x - p.x) ** 2 + (q.y - (y0 + o)) ** 2 >= (2 * r + .6) ** 2)) { dy = o; break; } }
    const q = {x: p.x, y: y0 + dy}; placed.push(q); out[p.i] = q;
  });
  return out;
}
/* the three arrangements of the 20 dots: mixed (one row), by language (2 rows), by model (10 rows) */
const ROWS = {all: [190], lang: [130, 250], model: DATA.models.map((_, i) => 82 + i * 22)};
function layoutFor(task, mode) {
  const d = DATA[task], items = [];
  d.cpp.forEach((v, m) => items.push({t: v, lang: 0, m})); d.java.forEach((v, m) => items.push({t: v, lang: 1, m}));
  const gm = arr => Math.exp(arr.reduce((a, it) => a + Math.log(it.t), 0) / arr.length);
  const groups = mode === 'all' ? [items] : mode === 'lang' ? [0, 1].map(l => items.filter(it => it.lang === l)) : DATA.models.map((_, m) => items.filter(it => it.m === m));
  const pos = [], means = [];
  groups.forEach((g, gi) => {
    const y0 = ROWS[mode][gi], r = mode === 'model' ? 4.5 : 5;
    const sw = swarm(g.map(it => ({x: X(it.t)})), y0, r, mode === 'model' ? 0 : mode === 'lang' ? 34 : 40);
    g.forEach((it, k) => { pos[items.indexOf(it)] = sw[k]; });
    const h = mode === 'model' ? 8 : mode === 'lang' ? 38 : 46;
    means.push({x: X(gm(g)), y0: y0 - h, y1: y0 + h});
  });
  return {items, pos, means};
}
/* draws the 20 dots and returns setMode(mode); dots keep their identity when they regroup */
function dotPlot(s, task) {
  const gL = s.el('g', {}), gM = s.el('g', {});
  const L0 = layoutFor(task, 'all');
  const U = s.units(L0.items, {r: 5});
  U.forEach((u, j) => { const p = L0.pos[j]; u.x = p.x; u.y = p.y; u.c.setAttribute('cx', p.x); u.c.setAttribute('cy', p.y);
    u.c.style.fill = u.it.lang ? C.fill.amber : C.fill.green; u.c.setAttribute('stroke', C.bg); u.c.setAttribute('stroke-width', 1); u.c.style.opacity = 0; });
  U.forEach((u, j) => s.at(200 + j * 40, () => { u.c.style.opacity = 1; }));
  const labels = s.el('g', {});
  let mode = null, busy = 0;
  function residuals(L, delay) {
    gL.innerHTML = ''; gM.innerHTML = '';
    L.means.forEach(mn => { const e = s.el('line', {x1: mn.x, x2: mn.x, y1: mn.y0, y2: mn.y1, stroke: C.ink, 'stroke-width': 1.6, 'stroke-dasharray': '3 3'}, gM); s.fadeIn(e, 300, delay); });
    L.items.forEach((it, j) => {
      const grp = mode === 'all' ? 0 : mode === 'lang' ? it.lang : it.m, mn = L.means[grp], p = L.pos[j];
      const e = s.el('line', {x1: p.x, x2: mn.x, y1: p.y, y2: p.y, stroke: C.mut, 'stroke-width': 1.3, 'stroke-opacity': .8}, gL); s.fadeIn(e, 300, delay + 100);
    });
  }
  function rowLabels(m, delay) {
    labels.innerHTML = '';
    const add = (y, txt, c) => labels.appendChild(s.write(96, y + 4.5, txt, {z: 13, a: 'end', c, t: delay}));
    if (m === 'all') { add(190, 'all 20', 'ink'); labels.appendChild(s.write(layoutFor(task, 'all').means[0].x, 136, 'average', {h: 1, z: 17, c: 'ink', t: delay})); }
    if (m === 'lang') { add(130, 'C++', 'green'); add(250, 'Java', 'amber'); }
    if (m === 'model') DATA.short.forEach((nm, i) => add(ROWS.model[i], nm, 'ink'));
  }
  function setMeter(m) {
    const sp = SPLIT[task], removed = m === 'lang' ? sp.lang : m === 'model' ? sp.model : 0;
    const bar = s.q('#mbar'); bar.style.fill = m === 'model' ? C.fill.violet : C.fill.blue;
    s.bar(bar, removed, 700);
    s.swap('#mtxt', 'Variation left: ' + pc(1 - removed));
    s.swap('#mrem', m === 'all' ? '' : 'removed by ' + (m === 'lang' ? 'language' : 'model') + ': ' + pc(removed), m === 'model' ? 'violet' : 'blue');
  }
  async function setMode(m) {
    if (m === mode) return; const my = ++busy;
    mode = m; const L = layoutFor(task, m);
    gL.innerHTML = ''; gM.innerHTML = ''; labels.innerHTML = '';
    await s.arrange((it, j) => ({x: L.pos[j].x, y: L.pos[j].y, r: m === 'model' ? 4.5 : 5}), {du: 800, stagger: 12});
    if (my !== busy) return;
    rowLabels(m, 0); residuals(L, 150); s.at(500, () => setMeter(m));
  }
  return {setMode};
}
function groupButtons(s, plot, onPick) {
  const bs = {};
  const press = m => { Object.entries(bs).forEach(([k, b]) => b.setAttribute('aria-pressed', k === m ? 'true' : 'false')); plot.setMode(m); onPick && onPick(m); };
  bs.all = s.btn('', 'Mixed', () => press('all'));
  bs.lang = s.btn('', 'By language', () => press('lang'), {primary: true});
  bs.model = s.btn('', 'By model', () => press('model'), {primary: true});
  bs.all.setAttribute('aria-pressed', 'true');
  return {bs, press};
}
