const G = {cols: 14, rows: 8, cell: 16, x0: 78, y0: 22};
const WALL = new Set(), SRC = new Map();

for (let c = 9; c < 14; c++) if (c !== 11) WALL.add(3 * 14 + c);               // a second room
SRC.set(2 * 14 + 2, 255); SRC.set(6 * 14 + 11, 255);
function heatStep(a) {
  const b = a.slice();
  for (let r = 0; r < G.rows; r++) for (let c = 0; c < G.cols; c++) {
    const k = r * G.cols + c; if (WALL.has(k) || SRC.has(k)) continue;
    const nb = (rr, cc) => (rr < 0 || cc < 0 || rr >= G.rows || cc >= G.cols || WALL.has(rr * G.cols + cc)) ? a[k] : a[rr * G.cols + cc];
    b[k] = Math.floor((4 * a[k] + nb(r - 1, c) + nb(r + 1, c) + nb(r, c - 1) + nb(r, c + 1)) / 8);
  }
  return b;
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (A, B, k) => 'rgb(' + A.map((a, i) => Math.round(a + (B[i] - a) * k)).join(',') + ')';
const heatCol = v => { const k = Math.pow(v / 255, .55); const c0 = [44, 46, 51], c1 = hex('#BF8420'), c2 = hex('#E8604F'); return k < .5 ? mix(c0, c1, k * 2) : mix(c1, c2, (k - .5) * 2); };
